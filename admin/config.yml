# Editing screen configuration for Sveltia CMS.
#
# WHAT THIS DOES
#   Sveltia is a free, open-source editing screen that runs in your browser.
#   It talks to GitHub directly, so there is no database, no server and no
#   hosting provider involved. When you press Save it commits the change to
#   your GitHub repository.
#
# WHERE TO FIND IT
#   On your own computer:  http://localhost:8000/admin/
#     Start the preview first with "npm run serve", then sign in with GitHub.
#
#   On a published site:   https://YOUR-ADDRESS/admin/
#     Only if you later publish the site somewhere.
#
# IF THE SCREEN WILL NOT LOAD
#   Use the built-in local editor instead:
#     http://localhost:8000/admin/editor.html
#   It needs no internet connection, no GitHub account and no sign-in.
#   It writes straight into your content files and rebuilds the site.
#
# ADDING AN ARTICLE OR A PAGE
#   Nothing to do here. Both collections read their whole folder, so a new
#   file in content/topics/ or content/pages/ appears in the editing screen
#   on its own. Create it with the "New" button.
#
# Docs: https://sveltia.cms/docs

backend:
  name: github
  repo: CarlosBike/escape-the-bullshit
  branch: main
  # Do not add base_url or auth_endpoint here.
  #   base_url is for GitHub Enterprise. On github.com it makes the editing
  #   screen ask GitHub for the wrong address and the answer is a 404.
  #   auth_endpoint is for hosting providers' sign-in, which the GitHub
  #   backend does not use.

# Images and files you upload through the editing screen
media_folder: static/uploads
public_folder: /uploads

# While you work on your own computer. Change these to your real address
# if you publish the site later.
site_url: http://localhost:8000
display_url: http://localhost:8000

publish_mode: simple

collections:

  # ---------------------------------------------------------------------
  # TOPICS - the twelve articles.
  #
  # This reads the whole of content/topics/, so pressing "New" and filling
  # in the form creates a new article with no other change needed.
  # ---------------------------------------------------------------------
  - name: topics
    label: Topics
    label_singular: Topic
    folder: content/topics
    format: yaml-frontmatter
    extension: md
    create: true
    summary: "{{title}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: navTitle, label: Menu label, widget: string, required: false, hint: "Optional. A shorter version if the title is long." }
      - { name: blurb, label: Short description, widget: text, hint: "One line. This appears in the list of topics." }
      - { name: order, label: Order, widget: number, value: 50, hint: "Lower numbers appear first." }
      - { name: featured, label: Show on the home page, widget: boolean, default: false }
      - { name: lead, label: The introduction, widget: text }
      - { name: claim, label: The claim, widget: text, hint: "What is actually being said, and what is really true." }
      - { name: alternatives, label: Alternatives, widget: text, hint: "What to do instead." }
      - { name: responsible, label: Who is responsible?, widget: text }
      - { name: demand, label: What we need them to do, widget: text }
      - { name: status, label: Have they done it yet?, widget: text }
      - { name: sources, label: Sources, widget: text, hint: "Where a reader can check this for themselves." }
      - { name: advice, label: Note about getting professional advice, widget: text, hint: "Say when a reader should speak to a doctor, dentist or adviser." }

  # ---------------------------------------------------------------------
  # PAGES - the ordinary pages.
  #
  # Also folder-based, so a new page is one click.
  # ---------------------------------------------------------------------
  - name: pages
    label: Pages
    label_singular: Page
    folder: content/pages
    format: yaml-frontmatter
    extension: md
    create: true
    summary: "{{title}}"
    fields:
      - { name: title, label: Page title, widget: string }
      - { name: navLabel, label: Menu label, widget: string, required: false, hint: "What appears in the menu. Leave blank to use the title." }
      - { name: order, label: Menu order, widget: number, value: 50, hint: "Lower numbers appear first." }
      - { name: nav, label: Show in the menu, widget: boolean, default: true }
      - { name: hero, label: Show the big picture at the top, widget: boolean, default: false }
      - { name: description, label: Description, widget: text, hint: "Shown in search results. One or two sentences." }
      - { name: body, label: Page content, widget: markdown }
