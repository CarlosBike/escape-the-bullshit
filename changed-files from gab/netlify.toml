# Netlify build settings for Escape the Bullshit.
#
# This file tells Netlify how to build and publish the site, so the settings
# do not have to be remembered. Netlify reads it automatically.

[build]
  command = "npm run build"
  publish = "dist"

# The version of Node.js used for the build.
[build.environment]
  NODE_VERSION = "22"

# Nicer addresses for the pages, for example /lists/ instead of /lists.html
# and /topics/broadband/ instead of /topics/broadband/index.html.
#
# Remove the slashes on each line below when you want to use them. Test them
# before you rely on them, and keep the old addresses working with the 301
# redirects so nothing you have already shared breaks.
#
# [[redirects]]
#   from = "/lists/"
#   to = "/lists.html"
#   status = 301
#
# [[redirects]]
#   from = "/about/"
#   to = "/about.html"
#   status = 301
#
# [[redirects]]
#   from = "/contact/"
#   to = "/contact.html"
#   status = 301
#
# [[redirects]]
#   from = "/people/"
#   to = "/people.html"
#   status = 301
