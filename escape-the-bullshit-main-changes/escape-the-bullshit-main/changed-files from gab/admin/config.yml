# Editing screen configuration for Sveltia CMS.
#
# HOW THIS WORKS
#   The site is published on Netlify. This file tells the editing screen
#   which GitHub repository to read and write, and on which branch.
#
#   The editing screen lives at  YOUR-NETLIFY-ADDRESS/admin/
#   Sign in with GitHub. Each save is committed to the repository, and
#   Netlify rebuilds the site automatically.
#
#   While you work on your own computer, use the built-in local editor:
#       http://localhost:8000/admin/editor.html
#   It needs no internet connection and no sign-in.
#
# TO USE THE SVELTIA SCREEN
#   1. Publish the site on Netlify (README.md, section 8)
#   2. Put your real Netlify address in site_url and display_url below
#   3. Push this file to GitHub and wait for the deploy
#   4. Open YOUR-NETLIFY-ADDRESS/admin/ and sign in with GitHub
#
# Docs: https://sveltia.cms/docs

backend:
  name: github
  repo: CarlosBike/escape-the-bullshit
  branch: main
  base_url: https://api.github.com

# Images and files you upload through the editing screen
media_folder: static/uploads
public_folder: /uploads

# Your real Netlify address. Netlify gives it to you when the site is first
# deployed - it may not be exactly the one written below.
site_url: https://escape-the-bullshit.netlify.app
display_url: https://escape-the-bullshit.netlify.app

publish_mode: simple

collections:

